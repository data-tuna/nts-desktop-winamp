<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unofficial NTS Player</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
    <!-- What is on air, under Webamp's windows. Filled by nowPlaying.ts; Alt+3 toggles it. -->
    <div id="now-playing" class="draggable" hidden>
      <img class="draggable" alt="" hidden />
      <div class="text draggable">
        <div class="now draggable"></div>
        <div class="next draggable"></div>
      </div>
      <button type="button" title="Hide show info (Alt+3)" aria-label="Hide show info">&times;</button>
    </div>
  </body>
</html>
