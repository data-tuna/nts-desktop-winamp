[package]
name = "nts-desktop-winamp"
version = "0.1.1"
description = "Unofficial Winamp-style desktop player for NTS Radio"
authors = ["data-tuna"]
license = "MIT"
repository = "https://github.com/data-tuna/nts-desktop-winamp"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "nts_desktop_winamp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri::generate_context! needs it once tauri.conf.json has a plugins block.
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

# Size over speed: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi"] }
